spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate

server:
  forward-headers-strategy: framework

monitoring:
  error-alert:
    discord:
      enabled: ${DISCORD_ERROR_ALERT_ENABLED:true}
      webhook-url: ${DISCORD_ERROR_ALERT_WEBHOOK_URL:}
      connect-timeout: ${DISCORD_ERROR_ALERT_CONNECT_TIMEOUT:1s}
      read-timeout: ${DISCORD_ERROR_ALERT_READ_TIMEOUT:1s}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

ops:
  username: ${OPS_USERNAME}
  password: ${OPS_PASSWORD}

features:
  test-auth:
    enabled: ${TEST_AUTH_ENABLED:false}
    access-key: ${TEST_AUTH_ACCESS_KEY:}
