<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{title}}</title>
</head>
<body style="margin:0;padding:0;background:#f8f4f5;font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Pretendard',sans-serif;color:#241e20;">
  <div style="max-width:640px;margin:0 auto;padding:28px 18px;">
    <div style="background:#ff5a6f;border-radius:14px 14px 0 0;padding:22px 26px;">
      <span style="color:#fff;font-size:19px;font-weight:800;letter-spacing:-0.03em;">둘픽 (DulPick)</span>
    </div>
    <div style="background:#ffffff;border:1px solid #eadfe2;border-top:0;border-radius:0 0 14px 14px;padding:28px 26px;">
      <p style="margin:0 0 6px;color:#766b70;font-size:12px;">{{nickname}}님께</p>
      <h1 style="margin:0 0 18px;font-size:20px;line-height:1.4;">{{title}}</h1>
      <div style="font-size:14px;line-height:1.75;white-space:pre-wrap;">{{body}}</div>
      <div style="margin-top:30px;padding-top:18px;border-top:1px solid #eadfe2;">
        <p style="margin:0;color:#766b70;font-size:12px;line-height:1.7;">
          본 메일은 둘픽 서비스 운영 정책에 따라 발송되었습니다.<br>
          문의: dulpick.co@gmail.com
        </p>
        <p style="margin:12px 0 0;">
          <a href="{{unsubscribeUrl}}" style="color:#d94158;font-size:12px;">수신 거부</a>
        </p>
      </div>
      <p style="margin:22px 0 0;color:#b9aeb3;font-size:11px;">&copy; {{year}} 둘픽 (DulPick)</p>
    </div>
  </div>
</body>
</html>
