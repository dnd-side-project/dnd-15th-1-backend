spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/dulpick_db?serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
    username: ${DB_USERNAME:dev}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

auth:
  jwt:
    secret: ${JWT_SECRET}
  social:
    providers:
      google:
        audience: ${GOOGLE_SERVER_CLIENT_ID}
      kakao:
        audience: ${KAKAO_NATIVE_APP_KEY}
      apple:
        audience: ${APPLE_CLIENT_ID}
  apple:
    team-id: ${APPLE_TEAM_ID}
    key-id: ${APPLE_KEY_ID}
    client-id: ${APPLE_CLIENT_ID}
    private-key-base64: ${APPLE_PRIVATE_KEY_BASE64}
    token-encryption-key: ${PROVIDER_TOKEN_ENCRYPTION_KEY}
