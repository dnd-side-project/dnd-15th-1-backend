spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/dulpick_db?serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
    username: ${DB_USERNAME:dev}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

features:
  test-auth:
    enabled: ${TEST_AUTH_ENABLED:false}
    access-key: ${TEST_AUTH_ACCESS_KEY:dulpick-local-test-auth-access-key}

notification:
  fcm:
    # 서비스 계정 JSON은 저장소에 넣지 않고 안전한 경로에 별도로 전달합니다.
    # FIREBASE_SERVICE_ACCOUNT_BASE64를 받았다면 JSON 파일로 디코딩한 뒤 그 경로를 지정합니다.
    enabled: ${FCM_ENABLED:false}
    project-id: ${FIREBASE_PROJECT_ID:gen-lang-client-0028689995}
    credentials-path: ${FIREBASE_CREDENTIALS_PATH:/absolute/path/to/firebase-service-account.json}
  push:
    # openssl rand -base64 32로 생성하며 Firebase 서비스 계정 키와 분리합니다.
    registration-encryption-key: ${PUSH_REGISTRATION_ENCRYPTION_KEY:}

couple:
  public-base-url: ${PUBLIC_WEB_BASE_URL:http://localhost:8080}
  code-encryption:
    active-key-id: ${CONNECTION_CODE_KEY_VERSION:v1}
    active-key: ${CONNECTION_CODE_ENCRYPTION_KEY:${PROVIDER_TOKEN_ENCRYPTION_KEY}}
    previous-key-id: ${PREVIOUS_CONNECTION_CODE_KEY_VERSION:}
    previous-key: ${PREVIOUS_CONNECTION_CODE_ENCRYPTION_KEY:}
  abuse:
    ip-hash-key: ${CONNECTION_ABUSE_IP_HASH_KEY:${JWT_SECRET}}

auth:
  jwt:
    secret: ${JWT_SECRET}
  social:
    providers:
      google:
        audiences:
          - ${GOOGLE_SERVER_CLIENT_ID}
      kakao:
        audiences:
          - ${KAKAO_NATIVE_APP_KEY}
      apple:
        audiences:
          - ${APPLE_PROD_CLIENT_ID}
          - ${APPLE_DEV_CLIENT_ID}
  apple:
    team-id: ${APPLE_TEAM_ID}
    key-id: ${APPLE_KEY_ID}
    client-ids:
      - ${APPLE_PROD_CLIENT_ID}
      - ${APPLE_DEV_CLIENT_ID}
    private-key-path: ${APPLE_PRIVATE_KEY_PATH}
    token-encryption-key: ${PROVIDER_TOKEN_ENCRYPTION_KEY}
