spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/dulpick_db?serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
    username: ${DB_USERNAME:dev}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

auth:
  jwt:
    secret: ${JWT_SECRET}
