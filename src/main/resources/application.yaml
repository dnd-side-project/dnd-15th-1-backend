spring:
  application:
    name: dulpick
  profiles:
    default: local
  jackson:
    time-zone: Asia/Seoul
  flyway:
    baseline-on-migrate: true
    baseline-version: 0
  jpa:
    open-in-view: false

server:
  forward-headers-strategy: native

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

couple:
  public-base-url: ${PUBLIC_WEB_BASE_URL:http://localhost:8080}
  code-encryption-key: ${CONNECTION_CODE_ENCRYPTION_KEY:${PROVIDER_TOKEN_ENCRYPTION_KEY:}}
  abuse:
    preview-per-minute: 5
    preview-per-hour: 20
    connect-per-minute: 3
    connect-per-day: 10
    state-changes-per-day: 10
    code-failures-per-ten-minutes: 5
    ip-failures-per-hour: 50
    failure-block-duration: 15m
    retention: 30d
    cleanup-delay: 1h

features:
  test-auth:
    enabled: ${TEST_AUTH_ENABLED:false}
    access-key: ${TEST_AUTH_ACCESS_KEY:dulpick-local-test-auth-access-key}

auth:
  jwt:
    issuer: dulpick
    secret: ${JWT_SECRET}
    access-token-ttl: 15m
    refresh-token-ttl: 30d
  maintenance:
    fixed-delay: 1h
    batch-size: 1000
    max-batches-per-run: 10
    revoked-refresh-token-retention: 1d
  social:
    nonce-ttl: 10m
    providers:
      google:
        issuers:
          - https://accounts.google.com
          - accounts.google.com
        jwk-set-uri: https://www.googleapis.com/oauth2/v3/certs
        audiences:
          - ${GOOGLE_SERVER_CLIENT_ID:}
      kakao:
        issuers:
          - https://kauth.kakao.com
        jwk-set-uri: https://kauth.kakao.com/.well-known/jwks.json
        audiences:
          - ${KAKAO_NATIVE_APP_KEY:}
      apple:
        issuers:
          - https://appleid.apple.com
        jwk-set-uri: https://appleid.apple.com/auth/keys
        audiences:
          - ${APPLE_PROD_CLIENT_ID:}
          - ${APPLE_DEV_CLIENT_ID:}
  apple:
    team-id: ${APPLE_TEAM_ID:}
    key-id: ${APPLE_KEY_ID:}
    client-ids:
      - ${APPLE_PROD_CLIENT_ID:}
      - ${APPLE_DEV_CLIENT_ID:}
    private-key-path: ${APPLE_PRIVATE_KEY_PATH:}
    token-encryption-key: ${PROVIDER_TOKEN_ENCRYPTION_KEY:}
    token-uri: https://appleid.apple.com/auth/token
    revoke-uri: https://appleid.apple.com/auth/revoke
    client-secret-ttl: 5m
    revocation:
      process-delay: 1m
      batch-size: 20
      initial-retry-delay: 1m
      max-retry-delay: 1h
