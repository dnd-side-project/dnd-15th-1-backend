spring:
  application:
    name: dulpick
  profiles:
    default: local
  jackson:
    time-zone: Asia/Seoul
  flyway:
    baseline-on-migrate: true
    baseline-version: 0
  jpa:
    open-in-view: false

server:
  forward-headers-strategy: native

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

couple:
  public-base-url: ${PUBLIC_WEB_BASE_URL:http://localhost:8080}
  code-encryption-key: ${CONNECTION_CODE_ENCRYPTION_KEY:${PROVIDER_TOKEN_ENCRYPTION_KEY:}}
  code-encryption:
    active-key-id: ${CONNECTION_CODE_KEY_VERSION:v1}
    active-key: ${CONNECTION_CODE_ENCRYPTION_KEY:${PROVIDER_TOKEN_ENCRYPTION_KEY:}}
    previous-key-id: ${PREVIOUS_CONNECTION_CODE_KEY_VERSION:}
    previous-key: ${PREVIOUS_CONNECTION_CODE_ENCRYPTION_KEY:}
  abuse:
    preview-per-minute: 10
    preview-per-hour: 30
    connect-per-minute: 10
    connect-per-day: 30
    state-changes-per-day: 50
    code-failures-per-ten-minutes: 15
    ip-failures-per-hour: 100
    ip-hash-key: ${CONNECTION_ABUSE_IP_HASH_KEY:${JWT_SECRET}}
    failure-block-duration: 10m
    retention: 30d
    cleanup-delay: 1h

features:
  test-auth:
    enabled: ${TEST_AUTH_ENABLED:false}
    access-key: ${TEST_AUTH_ACCESS_KEY:dulpick-local-test-auth-access-key}

notification:
  marketing:
    consent-version: ${MARKETING_CONSENT_VERSION:2026-08-07}
  push:
    registration-encryption-key: ${PUSH_REGISTRATION_ENCRYPTION_KEY:}
  fcm:
    enabled: ${FCM_ENABLED:false}
    project-id: ${FIREBASE_PROJECT_ID:}
    credentials-path: ${FIREBASE_CREDENTIALS_PATH:}
    process-delay: ${FCM_PROCESS_DELAY:10s}
    batch-size: ${FCM_BATCH_SIZE:50}
    initial-retry-delay: ${FCM_INITIAL_RETRY_DELAY:1m}
    max-retry-delay: ${FCM_MAX_RETRY_DELAY:1h}
    sending-timeout: ${FCM_SENDING_TIMEOUT:10m}
    max-attempts: ${FCM_MAX_ATTEMPTS:5}
  maintenance:
    fixed-delay: ${NOTIFICATION_CLEANUP_DELAY:1h}
    notification-retention: ${NOTIFICATION_RETENTION:90d}
    feedback-retention: ${FEEDBACK_RETENTION:365d}
    batch-size: ${NOTIFICATION_CLEANUP_BATCH_SIZE:1000}
    max-batches-per-run: ${NOTIFICATION_CLEANUP_MAX_BATCHES:10}

place-analysis:
  enabled: ${PLACE_ANALYSIS_ENABLED:false}
  daily-limit: ${PLACE_ANALYSIS_DAILY_LIMIT:100}
  max-candidates: ${PLACE_ANALYSIS_MAX_CANDIDATES:20}
  max-retries: ${PLACE_ANALYSIS_MAX_RETRIES:1}
  stale-timeout-seconds: ${PLACE_ANALYSIS_STALE_TIMEOUT_SECONDS:600}
  retry-cooldown-seconds: ${PLACE_ANALYSIS_RETRY_COOLDOWN_SECONDS:300}
  max-retry-count: ${PLACE_ANALYSIS_MAX_RETRY_COUNT:3}
  recovery-enabled: ${PLACE_ANALYSIS_RECOVERY_ENABLED:true}
  recovery-delay: ${PLACE_ANALYSIS_RECOVERY_DELAY:5s}
  recovery-batch-size: ${PLACE_ANALYSIS_RECOVERY_BATCH_SIZE:20}
  worker-concurrency: ${PLACE_ANALYSIS_WORKER_CONCURRENCY:2}
  public-crawler-enabled: ${PLACE_PUBLIC_CRAWLER_ENABLED:false}

instagram:
  metadata:
    official-enabled: ${INSTAGRAM_METADATA_OFFICIAL_ENABLED:false}
    access-token: ${INSTAGRAM_METADATA_ACCESS_TOKEN:}
    base-url: ${INSTAGRAM_METADATA_BASE_URL:https://graph.facebook.com}
    oembed-path: ${INSTAGRAM_OEMBED_PATH:/v22.0/instagram_oembed}
    public-crawler-enabled: ${PLACE_PUBLIC_CRAWLER_ENABLED:false}
    timeout-seconds: ${INSTAGRAM_METADATA_TIMEOUT_SECONDS:5}

gemini:
  enabled: ${GEMINI_ENABLED:false}
  api-key: ${GEMINI_API_KEY:}
  model: ${GEMINI_MODEL:gemini-3.5-flash-lite}
  base-url: ${GEMINI_BASE_URL:https://generativelanguage.googleapis.com}
  timeout-seconds: ${GEMINI_TIMEOUT_SECONDS:10}

kakao:
  local:
    enabled: ${KAKAO_LOCAL_ENABLED:false}
    rest-api-key: ${KAKAO_REST_API_KEY:}
    base-url: ${KAKAO_LOCAL_BASE_URL:https://dapi.kakao.com}
    timeout-seconds: ${KAKAO_LOCAL_TIMEOUT_SECONDS:3}
  map-photo-scraping:
    enabled: ${KAKAO_MAP_PHOTO_SCRAPING_ENABLED:true}
    base-url: ${KAKAO_MAP_PHOTO_BASE_URL:https://place-api.map.kakao.com}
    timeout-seconds: ${KAKAO_MAP_PHOTO_TIMEOUT_SECONDS:2}
    max-images: ${KAKAO_MAP_PHOTO_MAX_IMAGES:5}
    app-version: ${KAKAO_MAP_PHOTO_APP_VERSION:6.6.0}

auth:
  jwt:
    issuer: dulpick
    secret: ${JWT_SECRET}
    access-token-ttl: 15m
    refresh-token-ttl: 30d
  maintenance:
    fixed-delay: 1h
    batch-size: 1000
    max-batches-per-run: 10
    revoked-refresh-token-retention: 1d
  social:
    nonce-ttl: 10m
    providers:
      google:
        issuers:
          - https://accounts.google.com
          - accounts.google.com
        jwk-set-uri: https://www.googleapis.com/oauth2/v3/certs
        audiences:
          - ${GOOGLE_SERVER_CLIENT_ID:}
          - ${GOOGLE_IOS_CLIENT_ID:}
          - ${GOOGLE_DEV_CLIENT_ID:}
      kakao:
        issuers:
          - https://kauth.kakao.com
        jwk-set-uri: https://kauth.kakao.com/.well-known/jwks.json
        audiences:
          - ${KAKAO_NATIVE_APP_KEY:}
          - ${KAKAO_DEBUG_NATIVE_APP_KEY:}
      apple:
        issuers:
          - https://appleid.apple.com
        jwk-set-uri: https://appleid.apple.com/auth/keys
        audiences:
          - ${APPLE_PROD_CLIENT_ID:}
          - ${APPLE_DEV_CLIENT_ID:}
  apple:
    team-id: ${APPLE_TEAM_ID:}
    key-id: ${APPLE_KEY_ID:}
    client-ids:
      - ${APPLE_PROD_CLIENT_ID:}
      - ${APPLE_DEV_CLIENT_ID:}
    private-key-path: ${APPLE_PRIVATE_KEY_PATH:}
    token-encryption-key: ${PROVIDER_TOKEN_ENCRYPTION_KEY:}
    token-uri: https://appleid.apple.com/auth/token
    revoke-uri: https://appleid.apple.com/auth/revoke
    client-secret-ttl: 5m
    revocation:
      process-delay: 1m
      batch-size: 20
      initial-retry-delay: 1m
      max-retry-delay: 1h
