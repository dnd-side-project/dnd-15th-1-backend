spring:
  application:
    name: dulpick
  profiles:
    default: local
  jpa:
    open-in-view: false

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

auth:
  jwt:
    issuer: dulpick
    secret: ${JWT_SECRET}
    access-token-ttl: 15m
    refresh-token-ttl: 30d
  social:
    nonce-ttl: 5m
