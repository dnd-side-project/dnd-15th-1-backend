spring:
  application:
    name: dulpick
  profiles:
    default: local
  flyway:
    baseline-on-migrate: true
    baseline-version: 1
  jpa:
    open-in-view: false

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

auth:
  jwt:
    issuer: dulpick
    secret: ${JWT_SECRET}
    access-token-ttl: 15m
    refresh-token-ttl: 30d
  social:
    nonce-ttl: 5m
    providers:
      google:
        issuers:
          - https://accounts.google.com
          - accounts.google.com
        jwk-set-uri: https://www.googleapis.com/oauth2/v3/certs
        audience: ${GOOGLE_IOS_CLIENT_ID:}
      kakao:
        issuers:
          - https://kauth.kakao.com
        jwk-set-uri: https://kauth.kakao.com/.well-known/jwks.json
        audience: ${KAKAO_NATIVE_APP_KEY:}
      apple:
        issuers:
          - https://appleid.apple.com
        jwk-set-uri: https://appleid.apple.com/auth/keys
        audience: ${APPLE_CLIENT_ID:}
  apple:
    team-id: ${APPLE_TEAM_ID:}
    key-id: ${APPLE_KEY_ID:}
    client-id: ${APPLE_CLIENT_ID:}
    private-key-base64: ${APPLE_PRIVATE_KEY_BASE64:}
    token-encryption-key: ${PROVIDER_TOKEN_ENCRYPTION_KEY:}
    token-uri: https://appleid.apple.com/auth/token
    revoke-uri: https://appleid.apple.com/auth/revoke
    client-secret-ttl: 5m
