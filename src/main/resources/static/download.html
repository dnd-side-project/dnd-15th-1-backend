<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="둘픽 앱을 App Store 또는 Google Play에서 다운로드하세요.">
  <meta name="theme-color" content="#FF5A6F">
  <meta name="apple-itunes-app" content="app-id=6796011877">
  <meta property="og:title" content="둘픽 앱 다운로드">
  <meta property="og:description" content="둘픽 앱을 설치하고 숏폼 속 데이트 장소를 저장해 보세요.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://dulpick.omong.kr/download">
  <meta property="og:image" content="https://dulpick.omong.kr/assets/logo_app.png">
  <title>둘픽 앱 다운로드</title>
  <link rel="canonical" href="https://dulpick.omong.kr/download">
  <link rel="icon" href="/favicon.png" type="image/png">
  <link rel="stylesheet" href="/assets/site.css">
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-91V1WZ1N46"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'G-91V1WZ1N46');
  </script>
  <style>
    .download-page {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: #fff7f8;
      color: #241e20;
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", sans-serif;
      text-align: center;
    }

    .download-card {
      width: min(100%, 420px);
      padding: 42px 28px 36px;
      border: 1px solid #eadfe2;
      border-radius: 24px;
      background: #ffffff;
      box-shadow: 0 18px 50px rgba(53, 35, 38, 0.1);
    }

    .download-logo {
      width: 76px;
      height: 76px;
      margin: 0 auto 20px;
      display: block;
      border-radius: 22px;
      object-fit: cover;
    }

    .download-card h1 {
      margin: 0 0 12px;
      font-size: 28px;
      letter-spacing: -0.06em;
    }

    .download-card p {
      margin: 0;
      color: #766b70;
      font-size: 15px;
      line-height: 1.7;
    }

    .download-button {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 50px;
      padding: 0 22px;
      border-radius: 14px;
      background: #ff5a6f;
      color: #ffffff;
      font-size: 15px;
      font-weight: 750;
      text-decoration: none;
    }

    .download-links {
      display: grid;
      gap: 10px;
      margin-top: 26px;
    }

    .download-button:hover {
      background: #e64960;
    }

    .download-note {
      margin-top: 16px !important;
      font-size: 12px !important;
    }
  </style>
</head>
<body class="download-page">
<main class="download-card">
  <img class="download-logo" src="/assets/logo_app.png" alt="둘픽 앱 로고">
  <h1>둘픽 앱을 다운로드하세요</h1>
  <p>숏폼에서 발견한 데이트 장소를<br>연인과 함께 저장해 보세요.</p>
  <div class="download-links" role="group" aria-label="둘픽 다운로드">
    <a class="download-button" data-store="app_store" href="https://apps.apple.com/kr/app/%EB%91%98%ED%94%BD-dulpick/id6796011877" target="_blank" rel="noopener noreferrer">App Store에서 다운로드</a>
    <a class="download-button" data-store="google_play" href="https://play.google.com/store/apps/details?id=com.dulpick.app" target="_blank" rel="noopener noreferrer">Google Play에서 다운로드</a>
  </div>
  <p id="download-note" class="download-note">사용 중인 기기에 맞는 스토어를 선택해 주세요.</p>
</main>

<script>
  (() => {
    const stores = {
      app_store: {
        name: "App Store",
        url: "https://apps.apple.com/kr/app/%EB%91%98%ED%94%BD-dulpick/id6796011877"
      },
      google_play: {
        name: "Google Play",
        url: "https://play.google.com/store/apps/details?id=com.dulpick.app"
      }
    };
    const userAgent = navigator.userAgent;
    const isAndroid = /Android/i.test(userAgent);
    const isIOS = /iPhone|iPad|iPod/i.test(userAgent)
      || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
    const targetStore = isAndroid ? "google_play" : isIOS ? "app_store" : null;
    const downloadNote = document.getElementById("download-note");
    let hasRedirected = false;

    const redirectToStore = () => {
      if (hasRedirected) {
        return;
      }
      hasRedirected = true;
      window.location.replace(stores[targetStore].url);
    };

    document.querySelectorAll("a.download-button").forEach((link) => {
      link.addEventListener("click", () => {
        hasRedirected = true;
        gtag("event", "store_click", {
          store: link.dataset.store,
          link_url: link.href
        });
      });
    });

    if (!targetStore) {
      return;
    }

    downloadNote.textContent = `잠시 후 ${stores[targetStore].name}로 이동합니다.`;
    window.setTimeout(() => {
      const fallback = window.setTimeout(redirectToStore, 1000);
      gtag("event", "store_redirect", {
        store: targetStore,
        link_url: stores[targetStore].url,
        method: "automatic",
        event_callback: () => {
          window.clearTimeout(fallback);
          redirectToStore();
        },
        event_timeout: 800
      });
    }, 250);
  })();
</script>
</body>
</html>
