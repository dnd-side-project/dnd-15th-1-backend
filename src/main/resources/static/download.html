<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="둘픽 앱을 App Store에서 다운로드하세요.">
  <meta name="theme-color" content="#FF5A6F">
  <meta name="apple-itunes-app" content="app-id=6796011877">
  <meta property="og:title" content="둘픽 앱 다운로드">
  <meta property="og:description" content="둘픽 앱을 설치하고 숏폼 속 데이트 장소를 저장해 보세요.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://dulpick.omong.kr/download">
  <meta property="og:image" content="https://dulpick.omong.kr/assets/logo_app.png">
  <title>둘픽 앱 다운로드</title>
  <link rel="canonical" href="https://dulpick.omong.kr/download">
  <link rel="icon" href="/favicon.png" type="image/png">
  <link rel="stylesheet" href="/assets/site.css">
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-91V1WZ1N46"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'G-91V1WZ1N46');
  </script>
  <style>
    .download-page {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: #fff7f8;
      color: #241e20;
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", sans-serif;
      text-align: center;
    }

    .download-card {
      width: min(100%, 420px);
      padding: 42px 28px 36px;
      border: 1px solid #eadfe2;
      border-radius: 24px;
      background: #ffffff;
      box-shadow: 0 18px 50px rgba(53, 35, 38, 0.1);
    }

    .download-logo {
      width: 76px;
      height: 76px;
      margin: 0 auto 20px;
      display: block;
      border-radius: 22px;
      object-fit: cover;
    }

    .download-card h1 {
      margin: 0 0 12px;
      font-size: 28px;
      letter-spacing: -0.06em;
    }

    .download-card p {
      margin: 0;
      color: #766b70;
      font-size: 15px;
      line-height: 1.7;
    }

    .download-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 50px;
      margin-top: 26px;
      padding: 0 22px;
      border-radius: 14px;
      background: #ff5a6f;
      color: #ffffff;
      font-size: 15px;
      font-weight: 750;
      text-decoration: none;
    }

    .download-note {
      margin-top: 16px !important;
      font-size: 12px !important;
    }
  </style>
</head>
<body class="download-page">
<main class="download-card">
  <img class="download-logo" src="/assets/logo_app.png" alt="둘픽 앱 로고">
  <h1>둘픽 앱을 다운로드하세요</h1>
  <p>숏폼에서 발견한 데이트 장소를<br>연인과 함께 저장해 보세요.</p>
  <a id="app-store-link" class="download-button" href="https://apps.apple.com/kr/app/%EB%91%98%ED%94%BD-dulpick/id6796011877" target="_blank" rel="noopener">App Store에서 다운로드</a>
  <p class="download-note">잠시 후 App Store로 이동합니다.</p>
</main>

<script>
  (() => {
    const appStoreUrl = "https://apps.apple.com/kr/app/%EB%91%98%ED%94%BD-dulpick/id6796011877";
    const link = document.getElementById("app-store-link");
    let hasRedirected = false;

    const redirectToAppStore = () => {
      if (hasRedirected) {
        return;
      }
      hasRedirected = true;
      window.location.replace(appStoreUrl);
    };

    link.addEventListener("click", () => {
      gtag("event", "app_store_click", {link_url: appStoreUrl});
    });

    window.setTimeout(() => {
      const fallback = window.setTimeout(redirectToAppStore, 1000);
      gtag("event", "app_store_redirect", {
        method: "automatic",
        event_callback: () => {
          window.clearTimeout(fallback);
          redirectToAppStore();
        },
        event_timeout: 800
      });
    }, 250);
  })();
</script>
</body>
</html>
