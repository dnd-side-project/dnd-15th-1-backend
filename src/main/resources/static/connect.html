<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="둘픽 커플 연결 초대">
  <meta name="theme-color" content="#FF5A6F">
  <title>커플 연결 초대 — 둘픽 (DulPick)</title>
  <link rel="canonical" href="https://dulpick.omong.kr/connect">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/assets/site.css">
</head>
<body class="invite-page">

<main class="invite-shell">
  <section class="invite-card" aria-labelledby="invite-title">
    <a href="/" class="invite-logo">둘픽</a>
    <span class="invite-badge">커플 연결 초대</span>
    <h1 id="invite-title">둘픽에서 함께<br>데이트 장소를 모아보세요</h1>

    <div id="valid-invitation" class="invitation-result" hidden>
      <p class="invite-description">둘픽 앱을 열고 아래 연결 코드를 확인해 주세요.</p>
      <div class="connection-code" aria-label="연결 코드">
        <span id="connection-code"></span>
      </div>
      <p class="invite-note">연결 전 상대방 정보를 확인하고 직접 승인할 수 있습니다.</p>
    </div>

    <div id="invalid-invitation" class="invitation-result" hidden>
      <p class="invite-description">올바르지 않은 커플 초대 링크입니다.</p>
      <p class="invite-note">초대한 상대방에게 새로운 연결 코드를 요청해 주세요.</p>
    </div>

    <noscript>
      <p class="invite-description">둘픽 앱에서 공유받은 연결 코드를 확인해 주세요.</p>
    </noscript>

    <p class="release-status">둘픽 iOS 앱 출시 준비 중</p>

    <div class="invite-links">
      <a href="/privacy">개인정보처리방침</a>
      <a href="/terms">이용약관</a>
    </div>
  </section>
</main>

<script>
  (() => {
    const codePattern = /^[A-Z]{5}$/;
    const parameters = new URLSearchParams(window.location.search);
    const codes = parameters.getAll("code");
    const isValid = codes.length === 1 && codePattern.test(codes[0]);
    const validInvitation = document.getElementById("valid-invitation");
    const invalidInvitation = document.getElementById("invalid-invitation");

    if (!isValid) {
      invalidInvitation.hidden = false;
      return;
    }

    document.getElementById("connection-code").textContent = codes[0];
    validInvitation.hidden = false;
  })();
</script>

</body>
</html>
