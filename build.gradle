plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.0'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'kr.omong'
version = '0.0.1-SNAPSHOT'
description = 'dulpick'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

def querydslVersion = '7.5'

configurations {
    mockitoAgent
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-security-oauth2-resource-server'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.0.3'
    implementation 'com.google.firebase:firebase-admin:9.10.0'
    implementation "io.github.openfeign.querydsl:querydsl-jpa:${querydslVersion}"
    compileOnly 'org.projectlombok:lombok'
    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    runtimeOnly 'com.mysql:mysql-connector-j'
    runtimeOnly 'org.flywaydb:flyway-mysql'
    annotationProcessor 'org.projectlombok:lombok'
    annotationProcessor "io.github.openfeign.querydsl:querydsl-apt:${querydslVersion}:jakarta"
    annotationProcessor 'jakarta.persistence:jakarta.persistence-api'
    annotationProcessor 'jakarta.annotation:jakarta.annotation-api'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-security-oauth2-resource-server-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    mockitoAgent('org.mockito:mockito-core') {
        transitive = false
    }
    testCompileOnly 'org.projectlombok:lombok'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testAnnotationProcessor 'org.projectlombok:lombok'
}

def configureTestTask = { Test testTask ->
    testTask.useJUnitPlatform()
    testTask.systemProperty 'notification.fcm.enabled', 'false'
    testTask.systemProperty 'place-analysis.recovery-enabled', 'false'
    testTask.systemProperty 'spring.datasource.hikari.maximum-pool-size', '12'
    testTask.systemProperty 'spring.datasource.hikari.minimum-idle', '0'
    testTask.systemProperty 'spring.datasource.hikari.idle-timeout', '10000'
    testTask.systemProperty 'spring.datasource.hikari.connection-timeout', '10000'
    // The suite uses several intentional property and mock variants. Keep them
    // cached long enough to avoid repeatedly booting Spring and Flyway.
    testTask.systemProperty 'spring.test.context.cache.maxSize', '32'
    // Scheduled recovery workers are not part of test assertions. Do not wait
    // for their production shutdown grace period between cached contexts.
    testTask.systemProperty 'spring.task.scheduling.shutdown.await-termination', 'false'
    testTask.jvmArgs += '-Xshare:off'
    testTask.jvmArgs += "-javaagent:${configurations.mockitoAgent.asPath}"
}

tasks.named('test', Test) {
    configureTestTask(delegate)
    // The default suite protects the production-critical paths and stays fast enough for every PR.
    [
        'AuthSecurityIntegrationTest',
        'AuthTokenCommandIntegrationTest',
        'RefreshTokenConcurrencyIntegrationTest',
        'RefreshTokenReplayGraceIntegrationTest',
        'AppleWithdrawalIntegrationTest',
        'AuthenticationDataCleanupIntegrationTest',
        'TestAuthIntegrationTest',
        'TestAuthDisabledIntegrationTest',
        'OpsAuthenticationIntegrationTest',
        'UniversalLinkIntegrationTest',
        'ConnectionAbusePreventionIntegrationTest',
        'CoupleConnectionConcurrencyIntegrationTest',
        'CoupleConnectionIntegrationTest',
        'CoupleWithdrawalRollbackIntegrationTest',
        'PlaceConfirmationConcurrencyIntegrationTest',
        'PlaceImportClaimIntegrationTest',
        'PlaceStorageIntegrationTest',
        'PlaceContentsIntegrationTest',
        'ContentSearchIntegrationTest',
        'PlaceClassificationAdminIntegrationTest',
        'PlaceMapIntegrationTest',
        'PlaceAnalysisPropertiesTest',
        'PlaceImportViewMapperRetryAfterTest',
        'PlaceImportPartialVerificationTest',
        'PushDeviceIntegrationTest',
        'NotificationSettingsIntegrationTest',
        'SelectiveNotificationIntegrationTest',
        'MarketingNotificationAdminIntegrationTest',
        'OperationsAdminIntegrationTest',
        'NotificationDeliveryWorkerIntegrationTest',
        'NotificationInboxIntegrationTest',
        'LoginNonceServiceTest',
        'SocialAccountServiceTest'
    ].each { testClass ->
        include "**/${testClass}.class"
    }
    include '**/DulpickApplicationTests.class'
    include '**/SocialOidcSignatureVerificationTest.class'
    include '**/IssuerAudienceValidatorTest.class'
    include '**/OidcSocialIdentityVerifierTest.class'
    include '**/SocialLoginHandlerTest.class'
    include '**/MemberAccessTokenValidatorTest.class'
    include '**/ProviderTokenCipherTest.class'
    include '**/ContentSourceUrlParserTest.class'
    include '**/PublicWebUrlValidatorTest.class'
    include '**/InstagramCaptionMetadataParserTest.class'
    include '**/InstagramThumbnailDownloaderTest.class'
    include '**/NaverPlaceHtmlParserTest.class'
    include '**/KakaoPlaceMatcherTest.class'
    include '**/KakaoPlaceVerifierTest.class'
    include '**/KakaoPlaceSearchClientCacheTest.class'
    include '**/PublicInstagramMetadataProviderTest.class'
    include '**/PublicWebMetadataProviderTest.class'
    include '**/PushRegistrationCipherTest.class'
    include '**/ContentImageStorageServiceTest.class'
    include '**/PlaceImageStorageServiceTest.class'
}

tasks.register('extendedTest', Test) {
    group = 'verification'
    description = 'Runs the complete unit and integration test suite, including extended regression cases.'
    configureTestTask(delegate)
    dependsOn testClasses
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
}

tasks.named('bootJar') {
    archiveFileName = 'app.jar'
}

tasks.named('jar') {
    enabled = false
}
