name: CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  build-and-push:
    name: Test, build and push image
    runs-on: ubuntu-latest

    services:
      mysql:
        image: public.ecr.aws/docker/library/mysql:8.0
        env:
          MYSQL_DATABASE: dulpick_test
          MYSQL_USER: dulpick
          MYSQL_PASSWORD: test-password
          MYSQL_ROOT_PASSWORD: root-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root -proot-password"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Test and build
        run: >-
          JWT_SECRET="$(openssl rand -base64 48)"
          PROVIDER_TOKEN_ENCRYPTION_KEY="$(openssl rand -base64 32)"
          ./gradlew clean build --no-daemon
        env:
          SPRING_DATASOURCE_URL: jdbc:mysql://127.0.0.1:3306/dulpick_test?serverTimezone=UTC&characterEncoding=UTF-8
          SPRING_DATASOURCE_USERNAME: dulpick
          SPRING_DATASOURCE_PASSWORD: test-password

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Omong server
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: production

    steps:
      - name: Checkout source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Sync deployment script
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          fingerprint: ${{ secrets.SSH_HOST_FINGERPRINT }}
          source: deploy/deploy.sh
          target: dulpick
          strip_components: 1
          overwrite: true

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        env:
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
          IMAGE_TAG: ${{ github.sha }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          GOOGLE_SERVER_CLIENT_ID: ${{ secrets.GOOGLE_SERVER_CLIENT_ID }}
          KAKAO_NATIVE_APP_KEY: ${{ secrets.KAKAO_NATIVE_APP_KEY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_KEY_ID: ${{ secrets.APPLE_KEY_ID }}
          APPLE_PROD_CLIENT_ID: ${{ secrets.APPLE_PROD_CLIENT_ID }}
          APPLE_DEV_CLIENT_ID: ${{ secrets.APPLE_DEV_CLIENT_ID }}
          APPLE_PRIVATE_KEY_BASE64: ${{ secrets.APPLE_PRIVATE_KEY_BASE64 }}
          PROVIDER_TOKEN_ENCRYPTION_KEY: ${{ secrets.PROVIDER_TOKEN_ENCRYPTION_KEY }}
          PUSH_REGISTRATION_ENCRYPTION_KEY: ${{ secrets.PUSH_REGISTRATION_ENCRYPTION_KEY }}
          FCM_ENABLED: ${{ secrets.FCM_ENABLED }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_SERVICE_ACCOUNT_BASE64: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_BASE64 }}
          TEST_AUTH_ENABLED: ${{ secrets.TEST_AUTH_ENABLED }}
          TEST_AUTH_ACCESS_KEY: ${{ secrets.TEST_AUTH_ACCESS_KEY }}
          PUBLIC_WEB_BASE_URL: ${{ secrets.PUBLIC_WEB_BASE_URL }}
          PLACE_ANALYSIS_ENABLED: "true"
          PLACE_PUBLIC_CRAWLER_ENABLED: "false"
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          fingerprint: ${{ secrets.SSH_HOST_FINGERPRINT }}
          envs: GHCR_USERNAME,GHCR_TOKEN,IMAGE_NAME,IMAGE_TAG,JWT_SECRET,GOOGLE_SERVER_CLIENT_ID,KAKAO_NATIVE_APP_KEY,APPLE_TEAM_ID,APPLE_KEY_ID,APPLE_PROD_CLIENT_ID,APPLE_DEV_CLIENT_ID,APPLE_PRIVATE_KEY_BASE64,PROVIDER_TOKEN_ENCRYPTION_KEY,PUSH_REGISTRATION_ENCRYPTION_KEY,FCM_ENABLED,FIREBASE_PROJECT_ID,FIREBASE_SERVICE_ACCOUNT_BASE64,TEST_AUTH_ENABLED,TEST_AUTH_ACCESS_KEY,PUBLIC_WEB_BASE_URL,PLACE_ANALYSIS_ENABLED,PLACE_PUBLIC_CRAWLER_ENABLED,GEMINI_API_KEY,KAKAO_REST_API_KEY
          script: |
            set -Eeuo pipefail

            readonly APP_DIR="${HOME}/dulpick"
            readonly ENV_FILE="${APP_DIR}/.env"
            readonly SECRETS_DIR="${APP_DIR}/secrets"
            readonly APPLE_PRIVATE_KEY_FILE="${SECRETS_DIR}/Dulpick_SIWA_AuthKey_6F3A6ZCY7J.p8"
            readonly FIREBASE_CREDENTIALS_FILE="${SECRETS_DIR}/firebase-service-account.json"
            readonly TEST_AUTH_ENABLED_VALUE="${TEST_AUTH_ENABLED:-false}"
            readonly FCM_ENABLED_VALUE="${FCM_ENABLED:-false}"
            readonly PLACE_ANALYSIS_ENABLED_VALUE="${PLACE_ANALYSIS_ENABLED:-false}"
            readonly PLACE_PUBLIC_CRAWLER_ENABLED_VALUE="${PLACE_PUBLIC_CRAWLER_ENABLED:-false}"

            require_value() {
              local key="$1"
              local value="$2"

              if [[ -z "${value}" ]]; then
                echo "Required deployment value is not configured: ${key}" >&2
                exit 1
              fi
            }

            validate_deployment_inputs() {
              require_value "GHCR_USERNAME" "${GHCR_USERNAME:-}"
              require_value "GHCR_TOKEN" "${GHCR_TOKEN:-}"
              require_value "IMAGE_NAME" "${IMAGE_NAME:-}"
              require_value "IMAGE_TAG" "${IMAGE_TAG:-}"
              require_value "JWT_SECRET" "${JWT_SECRET:-}"
              require_value \
                "GOOGLE_SERVER_CLIENT_ID" \
                "${GOOGLE_SERVER_CLIENT_ID:-}"
              require_value \
                "KAKAO_NATIVE_APP_KEY" \
                "${KAKAO_NATIVE_APP_KEY:-}"
              require_value "APPLE_TEAM_ID" "${APPLE_TEAM_ID:-}"
              require_value "APPLE_KEY_ID" "${APPLE_KEY_ID:-}"
              require_value \
                "APPLE_PROD_CLIENT_ID" \
                "${APPLE_PROD_CLIENT_ID:-}"
              require_value \
                "APPLE_DEV_CLIENT_ID" \
                "${APPLE_DEV_CLIENT_ID:-}"
              require_value \
                "APPLE_PRIVATE_KEY_BASE64" \
                "${APPLE_PRIVATE_KEY_BASE64:-}"
              require_value \
                "PROVIDER_TOKEN_ENCRYPTION_KEY" \
                "${PROVIDER_TOKEN_ENCRYPTION_KEY:-}"
              require_value \
                "PUBLIC_WEB_BASE_URL" \
                "${PUBLIC_WEB_BASE_URL:-}"

              if [[ "${PUBLIC_WEB_BASE_URL}" != "https://dulpick.omong.kr" ]]; then
                echo \
                  "PUBLIC_WEB_BASE_URL must be https://dulpick.omong.kr" \
                  >&2
                exit 1
              fi

              if [[ "${PLACE_ANALYSIS_ENABLED_VALUE}" != "true" && "${PLACE_ANALYSIS_ENABLED_VALUE}" != "false" ]]; then
                echo "PLACE_ANALYSIS_ENABLED must be true or false" >&2
                exit 1
              fi
              if [[ "${PLACE_PUBLIC_CRAWLER_ENABLED_VALUE}" != "true" && "${PLACE_PUBLIC_CRAWLER_ENABLED_VALUE}" != "false" ]]; then
                echo "PLACE_PUBLIC_CRAWLER_ENABLED must be true or false" >&2
                exit 1
              fi
              if [[ "${PLACE_ANALYSIS_ENABLED_VALUE}" == "true" ]]; then
                require_value "GEMINI_API_KEY" "${GEMINI_API_KEY:-}"
                require_value "KAKAO_REST_API_KEY" "${KAKAO_REST_API_KEY:-}"
              fi

              if [[ "${FCM_ENABLED_VALUE}" == "true" ]]; then
                require_value \
                  "PUSH_REGISTRATION_ENCRYPTION_KEY" \
                  "${PUSH_REGISTRATION_ENCRYPTION_KEY:-}"
                require_value "FIREBASE_PROJECT_ID" "${FIREBASE_PROJECT_ID:-}"
                require_value \
                  "FIREBASE_SERVICE_ACCOUNT_BASE64" \
                  "${FIREBASE_SERVICE_ACCOUNT_BASE64:-}"
                if ! printf '%s' "${FIREBASE_SERVICE_ACCOUNT_BASE64}" \
                  | base64 --decode >/dev/null 2>&1; then
                  echo "FIREBASE_SERVICE_ACCOUNT_BASE64 must be valid Base64" >&2
                  exit 1
                fi
              elif [[ "${FCM_ENABLED_VALUE}" != "false" ]]; then
                echo "FCM_ENABLED must be true or false" >&2
                exit 1
              fi

              if [[ "${TEST_AUTH_ENABLED_VALUE}" == "true" ]]; then
                require_value \
                  "TEST_AUTH_ACCESS_KEY" \
                  "${TEST_AUTH_ACCESS_KEY:-}"
                if (( ${#TEST_AUTH_ACCESS_KEY} < 32 )); then
                  echo \
                    "TEST_AUTH_ACCESS_KEY must contain at least 32 characters" \
                    >&2
                  exit 1
                fi
              elif [[ "${TEST_AUTH_ENABLED_VALUE}" != "false" ]]; then
                echo "TEST_AUTH_ENABLED must be true or false" >&2
                exit 1
              fi

              if ! printf '%s' "${APPLE_PRIVATE_KEY_BASE64}" \
                | base64 --decode >/dev/null 2>&1; then
                echo "APPLE_PRIVATE_KEY_BASE64 must be valid Base64" >&2
                exit 1
              fi

              if [[ ! -f "${ENV_FILE}" ]]; then
                echo "Environment file not found: ${ENV_FILE}" >&2
                exit 1
              fi
            }

            cleanup() {
              docker logout ghcr.io >/dev/null 2>&1 || true
            }

            update_env() {
              local key="$1"
              local value="$2"
              local temp_file

              temp_file="$(mktemp "${APP_DIR}/.env.XXXXXX")"
              awk -F= -v key="${key}" '$1 != key { print }' "${ENV_FILE}" > "${temp_file}"
              printf '%s=%s\n' "${key}" "${value}" >> "${temp_file}"
              chmod 600 "${temp_file}"
              mv "${temp_file}" "${ENV_FILE}"
            }

            validate_deployment_inputs

            chmod 700 "${APP_DIR}/deploy.sh"
            trap cleanup EXIT

            mkdir -p "${SECRETS_DIR}"
            chmod 700 "${SECRETS_DIR}"

            update_env "JWT_SECRET" "${JWT_SECRET}"
            update_env \
              "GOOGLE_SERVER_CLIENT_ID" \
              "${GOOGLE_SERVER_CLIENT_ID}"
            update_env "KAKAO_NATIVE_APP_KEY" "${KAKAO_NATIVE_APP_KEY}"
            update_env "APPLE_TEAM_ID" "${APPLE_TEAM_ID}"
            update_env "APPLE_KEY_ID" "${APPLE_KEY_ID}"
            update_env "APPLE_PROD_CLIENT_ID" "${APPLE_PROD_CLIENT_ID}"
            update_env "APPLE_DEV_CLIENT_ID" "${APPLE_DEV_CLIENT_ID}"
            update_env \
              "APPLE_PRIVATE_KEY_PATH" \
              "/run/secrets/Dulpick_SIWA_AuthKey_6F3A6ZCY7J.p8"
            update_env \
              "PROVIDER_TOKEN_ENCRYPTION_KEY" \
              "${PROVIDER_TOKEN_ENCRYPTION_KEY}"
            update_env "PUBLIC_WEB_BASE_URL" "${PUBLIC_WEB_BASE_URL}"
            update_env "PLACE_ANALYSIS_ENABLED" "${PLACE_ANALYSIS_ENABLED_VALUE}"
            update_env \
              "PLACE_PUBLIC_CRAWLER_ENABLED" \
              "${PLACE_PUBLIC_CRAWLER_ENABLED_VALUE}"
            if [[ -n "${GEMINI_API_KEY:-}" ]]; then
              update_env "GEMINI_ENABLED" "true"
              update_env "GEMINI_API_KEY" "${GEMINI_API_KEY}"
            else
              update_env "GEMINI_ENABLED" "false"
            fi
            if [[ -n "${KAKAO_REST_API_KEY:-}" ]]; then
              update_env "KAKAO_LOCAL_ENABLED" "true"
              update_env "KAKAO_REST_API_KEY" "${KAKAO_REST_API_KEY}"
            else
              update_env "KAKAO_LOCAL_ENABLED" "false"
            fi
            update_env "FCM_ENABLED" "${FCM_ENABLED_VALUE}"
            if [[ "${FCM_ENABLED_VALUE}" == "true" ]]; then
              update_env "FIREBASE_PROJECT_ID" "${FIREBASE_PROJECT_ID}"
              update_env \
                "FIREBASE_CREDENTIALS_PATH" \
                "/run/secrets/firebase-service-account.json"
              update_env \
                "PUSH_REGISTRATION_ENCRYPTION_KEY" \
                "${PUSH_REGISTRATION_ENCRYPTION_KEY}"
            fi
            if [[ "${TEST_AUTH_ENABLED_VALUE}" == "true" ]]; then
              update_env "TEST_AUTH_ENABLED" "true"
              update_env "TEST_AUTH_ACCESS_KEY" "${TEST_AUTH_ACCESS_KEY}"
            else
              update_env "TEST_AUTH_ENABLED" "false"
            fi

            private_key_temp="$(mktemp "${SECRETS_DIR}/apple-private-key.XXXXXX")"
            printf '%s' "${APPLE_PRIVATE_KEY_BASE64}" \
              | base64 --decode > "${private_key_temp}"
            chmod 600 "${private_key_temp}"
            mv "${private_key_temp}" "${APPLE_PRIVATE_KEY_FILE}"

            if [[ "${FCM_ENABLED_VALUE}" == "true" ]]; then
              firebase_credentials_temp="$(mktemp "${SECRETS_DIR}/firebase.XXXXXX")"
              printf '%s' "${FIREBASE_SERVICE_ACCOUNT_BASE64}" \
                | base64 --decode > "${firebase_credentials_temp}"
              chmod 600 "${firebase_credentials_temp}"
              mv "${firebase_credentials_temp}" "${FIREBASE_CREDENTIALS_FILE}"
            fi

            echo "${GHCR_TOKEN}" | docker login ghcr.io \
              --username "${GHCR_USERNAME}" \
              --password-stdin
            "${APP_DIR}/deploy.sh" \
              "${IMAGE_NAME}" \
              "${IMAGE_TAG}" \
              "${PUBLIC_WEB_BASE_URL}"
