name: CI

on:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - develop
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-and-build:
    name: Test and build
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Set up MySQL
        run: |
          set -Eeuo pipefail
          sudo systemctl start mysql.service
          for attempt in {1..30}; do
            if sudo mysqladmin --protocol=socket -uroot -proot ping --silent; then
              break
            fi
            if [ "${attempt}" -eq 30 ]; then
              echo "MySQL did not become ready in time" >&2
              exit 1
            fi
            sleep 1
          done
          sudo mysql --protocol=socket -uroot -proot <<'SQL'
          CREATE DATABASE IF NOT EXISTS dulpick_test
              CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
          CREATE USER IF NOT EXISTS 'dulpick'@'127.0.0.1' IDENTIFIED BY 'test-password';
          ALTER USER 'dulpick'@'127.0.0.1' IDENTIFIED BY 'test-password';
          GRANT ALL PRIVILEGES ON dulpick_test.* TO 'dulpick'@'127.0.0.1';
          FLUSH PRIVILEGES;
          SQL

      - name: Test and build
        run: |
          set -Eeuo pipefail
          build_started_at="$(date +%s)"
          JWT_SECRET="$(openssl rand -base64 48)" \
          PROVIDER_TOKEN_ENCRYPTION_KEY="$(openssl rand -base64 32)" \
            time ./gradlew build --no-daemon
          build_elapsed=$(( $(date +%s) - build_started_at ))
          echo "Gradle test/build elapsed seconds: ${build_elapsed}"
          {
            echo "### CI timing"
            echo "- Gradle test/build: ${build_elapsed}s"
          } >> "${GITHUB_STEP_SUMMARY}"
        env:
          SPRING_DATASOURCE_URL: jdbc:mysql://127.0.0.1:3306/dulpick_test?serverTimezone=UTC&characterEncoding=UTF-8
          SPRING_DATASOURCE_USERNAME: dulpick
          SPRING_DATASOURCE_PASSWORD: test-password
