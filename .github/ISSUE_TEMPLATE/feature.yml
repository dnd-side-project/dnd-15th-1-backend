name: 기능 요청
description: 새로운 기능이나 기능 개선 작업을 등록합니다.
title: "[Feat] "
body:
  - type: textarea
    id: summary
    attributes:
      label: 작업 내용
      description: 구현할 기능과 목적을 간결하게 작성해 주세요.
      placeholder: 구현할 기능과 필요한 이유를 작성해 주세요.
    validations:
      required: true

  - type: textarea
    id: details
    attributes:
      label: 상세 요구사항
      description: 기능의 동작 방식과 고려할 예외를 작성해 주세요.
      placeholder: |
        - 요구사항
        - 예외 상황
        - 관련 정책
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: 완료 조건
      description: 작업 완료를 판단할 수 있는 조건을 작성해 주세요.
      placeholder: |
        - [ ] 기능 구현
        - [ ] 핵심 로직 테스트
        - [ ] API 문서 반영
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: 우선순위
      description: 영향도와 위험도를 기준으로 선택해 주세요.
      options:
        - P1 - 인증, 권한, 개인정보, 데이터 손실 위험
        - P2 - 주요 기능, 공통 도메인, DB 및 API 계약
        - P3 - 운영 장애 긴급 대응
        - P4 - 일반 기능 및 제한된 범위의 수정
        - P5 - 문서, 단순 설정 및 비기능 변경
    validations:
      required: true

  - type: textarea
    id: references
    attributes:
      label: 참고 사항
      description: 관련 문서, 화면, API 또는 이슈가 있다면 작성해 주세요.
    validations:
      required: false
