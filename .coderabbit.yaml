# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json

language: "ko-KR"

tone_instructions: >
  모든 코드 리뷰 코멘트는 한국어로 작성하고, 문장 맨 앞에 P1~P5 우선순위를
  "PN: 내용" 형식으로 표기하세요. 문제가 없는 코드에는 코멘트를 남기지 마세요.

reviews:
  profile: "chill"
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true
  review_details: false
  collapse_walkthrough: true
  changed_files_summary: true
  suggested_labels: true
  suggested_reviewers: true
  path_filters: []
  path_instructions:
    - path: "**/*"
      instructions: |
        이 저장소의 모든 코드 리뷰 코멘트는 아래 규칙을 예외 없이 따라야 합니다.

        1. 언어
        모든 리뷰 코멘트는 반드시 한국어로 작성한다. 영어 코멘트는 허용하지 않는다.

        2. 코멘트 형식
        모든 리뷰 코멘트는 "PN: 내용" 형식으로 시작한다. N은 1부터 5까지의 숫자이며,
        콜론 뒤에 공백을 한 칸 두고 구체적인 문제와 개선 방향을 작성한다.
        예시: P2: 이 메서드는 예외를 던지지 않고 null을 반환하여 호출부에서
        NullPointerException이 발생할 수 있습니다. Optional 반환이나 명시적
        예외 처리를 고려하세요.

        3. 우선순위(PN) 판단 기준
        P1: 반드시 수정해야 하는 문제. 보안 취약점, 인증/인가 우회, 데이터 손실,
        프로덕션 장애를 유발할 수 있는 버그, 트랜잭션/동시성 오류, 심각한 예외
        처리 누락 등 병합 전에 반드시 해결해야 하는 이슈.
        P2: 수정이 권장되는 중요한 문제. 잠재적 버그, 잘못되거나 누락된 예외 처리,
        성능 저하, 중요 로직의 테스트 커버리지 누락, 잘못된 트랜잭션 경계 등
        병합은 가능하지만 빠르게 후속 조치가 필요한 이슈.
        P3: 일반적인 개선 사항. 가독성, 계층/책임 분리, 중복 코드 제거, 네이밍
        개선, 설계 원칙(예: SRP, DDD 계층 분리) 위반 등 기능 동작에는 문제가
        없지만 코드 품질을 높이는 제안.
        P4: 사소한 개선 사항. 주석, 포맷팅, 변수명, 로그 메시지, import 정리 등
        우선순위가 낮은 스타일성 제안.
        P5: 단순 의견 및 참고 사항. 강제성이 없는 참고 정보, 대안 소개, 질문성
        코멘트, 향후 고려사항 제안.

        4. 불필요한 코멘트 금지
        코드에 실질적인 문제나 개선점이 없는 파일 또는 라인에는 코멘트를 작성하지
        않는다. 형식적인 칭찬, 단순 요약성 코멘트, 근거 없는 지적은 남기지 않는다.

        5. 코멘트 단위
        하나의 코멘트에는 하나의 우선순위만 부여한다. 서로 다른 성격의 문제가
        섞여 있다면 코멘트를 나누어 각각에 적절한 우선순위를 부여한다.

        6. 적용 범위
        이 규칙은 프로젝트 전체 코드(Java 소스, 테스트 코드, YAML/properties 설정,
        SQL 마이그레이션, Gradle 빌드 스크립트, GitHub Actions 워크플로 등 모든
        파일 유형)에 동일하게 적용한다.
  auto_review:
    enabled: true
    auto_incremental_review: true
    drafts: false

chat:
  auto_reply: true
